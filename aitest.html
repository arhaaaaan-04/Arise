<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Arise AI Test</title>
</head>
<body>
  <h1>Arise AI Backend Test</h1>
  <button id="test">Test AI generation</button>
  <pre id="result">Ready.</pre>

  <script>
    document.getElementById("test").onclick = async () => {
      const result = document.getElementById("result");
      result.textContent = "Testing...";
      try {
        const response = await fetch(
          "https://ariseaibackend.khanarhaan19512.workers.dev/api/generate",
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              text: "Democracy is a form of government in which people elect their representatives.",
              subject: "Social Science",
              chapter: "Democracy",
              outputType: "AI Notes"
            })
          }
        );
        result.textContent =
          "HTTP " + response.status + "\n" +
          JSON.stringify(await response.json(), null, 2);
      } catch (error) {
        result.textContent = String(error) +
          "\nCheck the browser console for the specific network or CORS error.";
      }
    };
  </script>
</body>
</html>
